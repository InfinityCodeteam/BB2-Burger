<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>السلة - BB2 Burger</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    /* المتغيرات الأساسية */
    :root {
      --bg-dark: #121212;
      --bg-card: #1e1e1e;
      --brand: #FFD000;
      --brand-hover: #ffba00;
      --whatsapp: #25D366;
      --whatsapp-hover: #128C7E;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --danger: #ef4444;
      --success: #22c55e;
      --radius-sm: 12px;
      --radius-md: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: "Cairo", sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; overflow-x: hidden; padding-bottom: 90px; }
    .container { padding: 0 15px; max-width: 800px; margin: 0 auto; }

    /* النافبار العلوي */
    .top-header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 100; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .top-header img { height: 35px; object-fit: contain; }
    .icon-btn { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; text-decoration: none; transition: 0.3s; }
    .icon-btn:hover { background: var(--brand); color: #111; }

    .page-header { margin-top: 75px; margin-bottom: 20px; }
    .page-title { font-size: 22px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 10px; }
    .page-title i { color: var(--brand); }

    /* كروت السلة (شكل أفقي) */
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 12px; }
    #cart-list .card { display: flex; flex-direction: row; align-items: center; gap: 15px; background: var(--bg-card); padding: 12px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.03); box-shadow: 0 4px 10px rgba(0,0,0,0.15); position: relative; }
    #cart-list .card img { width: 90px; height: 90px; border-radius: 10px; object-fit: cover; margin: 0; flex-shrink: 0; background: #2a2a2a; }
    #cart-list .card > div { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    #cart-list .card h3 { font-size: 15px; font-weight: 800; margin-bottom: 2px; color: #fff; }
    #cart-list .card p { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
    #cart-list .price { font-size: 16px; font-weight: 900; color: var(--brand); margin-bottom: 0; }

    /* أزرار التحكم بالكمية */
    .cart-qty-control { display: flex; align-items: center; gap: 10px; margin-top: 8px; background: rgba(255, 255, 255, 0.05); padding: 5px; border-radius: 10px; width: max-content; }
    .c-qty-btn { width: 28px; height: 28px; border-radius: 8px; border: none; font-size: 16px; font-weight: 900; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
    .c-qty-btn.minus { background: #333; color: #fff; }
    .c-qty-btn.plus { background: var(--brand); color: #111; }
    .c-qty-btn:active { transform: scale(0.9); }
    .c-qty-display { font-size: 15px; font-weight: 900; min-width: 20px; text-align: center; color: #fff; }

    /* زر الحذف */
    #cart-list button.remove-btn { position: absolute; top: 12px; left: 12px; background: rgba(239, 68, 68, 0.15); color: var(--danger); border: none; width: 32px; height: 32px; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 14px; cursor: pointer; transition: 0.3s; padding: 0; }
    #cart-list button.remove-btn:hover { background: var(--danger); color: #fff; transform: translateY(-2px); }

    /* ملخص السعر */
    .summary-card { background: linear-gradient(135deg, rgba(255,208,0,0.1) 0%, rgba(255,208,0,0.02) 100%); border: 1px solid rgba(255, 208, 0, 0.2); border-radius: var(--radius-sm); padding: 20px; margin: 20px 0; display: flex; justify-content: space-between; align-items: center; }
    .summary-title { font-size: 16px; font-weight: 700; color: #fff; }
    #grand-total { font-size: 24px; font-weight: 900; color: var(--brand); }

    /* نموذج الدفع */
    .checkout-form { background: var(--bg-card); border-radius: var(--radius-md); padding: 20px; border: 1px solid rgba(255,255,255,0.03); box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
    .checkout-form h3 { font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .checkout-form h3 i { color: var(--brand); }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    .form-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 14px 15px; border-radius: 12px; color: #fff; font-family: "Cairo", sans-serif; font-size: 14px; font-weight: 600; transition: all 0.3s; outline: none; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--brand); background: rgba(255, 255, 255, 0.06); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .select-wrapper { position: relative; }
    .select-wrapper select { appearance: none; cursor: pointer; }
    .select-wrapper::after { content: '\f107'; font-family: "Font Awesome 5 Free"; font-weight: 900; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

    /* زر واتساب */
    #whatsapp-order { background: var(--whatsapp); color: #fff; border: none; width: 100%; padding: 16px; border-radius: 25px; font-size: 16px; font-weight: 900; margin-top: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); transition: 0.3s; }
    #whatsapp-order i { font-size: 20px; }
    #whatsapp-order:hover { background: var(--whatsapp-hover); transform: translateY(-2px); }
    #whatsapp-order:active { transform: scale(0.98); }

    /* النافبار السفلي */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding: 10px 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; transition: 0.3s; }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: var(--brand); }
    .nav-item.active i { transform: scale(1.1); }
    
    /* شارة السلة (Badge) */
    .cart-badge { position: absolute; top: -3px; right: -5px; background: var(--danger); color: #fff; font-size: 9px; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--bg-card); }

    /* الفوتر */
    .footer { background: var(--bg-card); padding: 30px 20px 100px; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; margin-top: 40px; }
    .social-links { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
    .social-links a { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.05); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 18px; text-decoration: none; transition: 0.3s; }
    .social-links a:hover { background: var(--brand); color: #000; }
    .footer-text { color: var(--text-muted); font-size: 11px; }

    @media (min-width: 768px) { .bottom-nav { display: none; } body { padding-bottom: 0; } }
  </style>
</head>
<body>

  <!-- الهيدر العلوي -->
  <header class="top-header">
    <img id="logo-img" src="logo.png" alt="BB2 Burger">
    <a href="index.html" class="icon-btn"><i class="fas fa-home"></i></a>
  </header>

  <!-- محتوى السلة -->
  <section class="container">
    <div class="page-header">
      <h2 class="page-title"><i class="fas fa-shopping-cart"></i> سلة التسوق</h2>
    </div>
    
    <!-- الكروت ستظهر هنا بواسطة app.js -->
    <div id="cart-list" class="grid-1"></div>
    
    <!-- ملخص السعر الإجمالي -->
    <div class="summary-card">
      <span class="summary-title">الإجمالي المطلوب:</span>
      <span id="grand-total">0 ج</span>
    </div>

    <!-- بيانات الدفع والتوصيل -->
    <div class="checkout-form">
      <h3><i class="fas fa-map-marker-alt"></i> بيانات التوصيل</h3>
      <div class="form-group">
        <label>الاسم الكريم</label>
        <input id="name" type="text" placeholder="أدخل اسمك بالكامل" required>
      </div>
      <div class="form-group">
        <label>رقم الموبايل</label>
        <input id="mobile" type="tel" placeholder="01xxxxxxxxx" required>
      </div>
      <div class="form-group">
        <label>العنوان بالتفصيل</label>
        <input id="address" type="text" placeholder="المنطقة، الشارع، رقم العمارة، الدور" required>
      </div>
      <div class="form-group">
        <label>ملاحظات إضافية (اختياري)</label>
        <textarea id="notes" placeholder="أمثلة: بدون بصل، صوص زيادة..."></textarea>
      </div>
      <div class="form-group">
        <label>طريقة الدفع</label>
        <div class="select-wrapper">
          <select id="payment" required>
            <option value="كاش عند الاستلام">كاش عند الاستلام</option>
            <option value="انستا باي">انستا باي</option>
            <option value="فودافون كاش">فودافون كاش</option>
            <option value="اتصالات كاش">اتصالات كاش</option>
          </select>
        </div>
      </div>
      <button id="whatsapp-order"><i class="fab fa-whatsapp"></i> إرسال الطلب عبر واتساب</button>
    </div>
  </section>

  <!-- الفوتر -->
  <footer class="footer">
    <div class="container">
      <div class="social-links">
        <a href="https://www.facebook.com/share/1EhgB6LvHR/"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/bb2burger"><i class="fab fa-instagram"></i></a>
        <a href="https://wa.me/201006473229"><i class="fab fa-whatsapp"></i></a>
        <a href="https://system.smart-mate.co/profile/5526289899"><i class="fas fa-globe"></i></a>
      </div>
      <p class="footer-text" id="footer-address">المنصورة - حي الجامعة</p>
      <p class="footer-text" id="footer-hours">مفتوح يومياً من 1 ظهراً حتى 3 فجراً</p>
      <p class="footer-text">© 2025 BB2 Burger. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <!-- النافبار السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fas fa-home"></i> <span>الرئيسية</span>
    </a>
    <a href="menu.html" class="nav-item">
      <i class="fas fa-hamburger"></i> <span>المنيو</span>
    </a>
    <a href="favorites.html" class="nav-item">
      <i class="far fa-heart"></i> <span>المفضلة</span>
    </a>
    <a href="cart.html" class="nav-item active" style="position: relative;">
      <i class="fas fa-shopping-cart"></i> <span>السلة</span>
      <div class="cart-badge" id="bottom-badge" style="display: none;">0</div>
    </a>
  </nav>

  <!-- السلة الأساسية المخفية (كاحتياطي) -->
  <div id="sticky-cart" style="display: none !important;">
    <span id="cart-count">0 عناصر</span>
    <span id="cart-total">0 ج</span>
  </div>

  <div id="toast" style="display: none; position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: var(--brand); color: #000; padding: 12px 25px; border-radius: 25px; font-weight: bold; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3);"></div>

  <!-- سكربت قراءة الإكسيل -->
  <script type="text/javascript">
    var gk_isXlsx = false;
    var gk_xlsxFileLookup = {};
    var gk_fileData = {};
    function filledCell(cell) { return cell !== '' && cell != null; }
    function loadFileData(filename) {
      if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
        try {
          var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
          var firstSheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[firstSheetName];
          var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
          var filteredData = jsonData.filter(row => row.some(filledCell));
          var headerRowIndex = filteredData.findIndex((row, index) =>
            row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
          );
          if (headerRowIndex === -1 || headerRowIndex > 25) { headerRowIndex = 0; }
          var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));
          csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
          return csv;
        } catch (e) {
          console.error(e);
          return "";
        }
      }
      return gk_fileData[filename] || "";
    }
  </script>

  <!-- ملف app.js المحدث الذي يتعامل مع كل شيء بذكاء -->
  <script src="app.js"></script>
</body>
</html>
