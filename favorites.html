<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>المفضلة - BB2 Burger</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    /* المتغيرات الأساسية */
    :root {
      --bg-dark: #121212;
      --bg-card: #1e1e1e;
      --brand: #FFD000;
      --brand-hover: #ffba00;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --danger: #ef4444;
      --success: #22c55e;
      --radius-sm: 12px;
      --radius-md: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Cairo", sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      padding-bottom: 90px;
    }

    .container {
      padding: 0 12px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* النافبار العلوي */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 100;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .top-header img {
      height: 35px;
      object-fit: contain;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      text-decoration: none;
      transition: 0.3s;
    }
    .icon-btn:hover { background: var(--brand); color: #000; }

    /* عنوان الصفحة */
    .page-header {
      margin-top: 75px;
      margin-bottom: 20px;
    }
    .page-title {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .page-title i { color: var(--danger); }

    /* --------------------------------------------------- */
    /* الكروت */
    /* --------------------------------------------------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px; 
    }
    
    .product-card, .card {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 8px; 
      border: 1px solid rgba(255,255,255,0.03);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.3s;
      height: 100%; 
      overflow: hidden; 
    }

    .product-card img {
      width: calc(100% + 16px); 
      margin: -8px -8px 6px -8px; 
      height: 115px; 
      object-fit: cover;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0; 
      background: #2a2a2a;
    }

    .product-card h3 {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; 
    }

    .product-card p, .card-desc {
      font-size: 9px; 
      color: rgba(255, 255, 255, 0.35); 
      margin-bottom: 6px; 
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 1; 
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price {
      font-size: 14px;
      font-weight: 900;
      color: var(--brand);
      display: block;
      margin-bottom: 8px;
      margin-top: auto; 
    }

    /* زر أضف للسلة */
    .add-cart-btn {
      background: var(--brand);
      color: #111;
      border: none;
      padding: 6px 10px; 
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      transition: 0.3s;
    }
    .add-cart-btn::before {
      content: '\f067'; 
      font-family: "Font Awesome 5 Free";
      font-weight: 900;
      font-size: 10px;
    }
    .add-cart-btn:hover, .add-cart-btn:active {
      background: var(--brand-hover);
      transform: translateY(-2px);
    }

    /* --------------------------------------------------- */
    /* التعديل الجديد: تصميم زر الإزالة من المفضلة         */
    /* --------------------------------------------------- */
    .remove-btn, .btn-danger, .remove-fav-btn {
      background: rgba(239, 68, 68, 0.15); /* أحمر شفاف قليلاً */
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin-top: 6px; /* مسافة بينه وبين زر أضف للسلة لو موجودين مع بعض */
      transition: 0.3s;
    }
    /* وضع أيقونة سلة المهملات برمجياً بالـ CSS */
    .remove-btn::before, .remove-fav-btn::before {
      content: '\f2ed'; /* كود أيقونة Trash من FontAwesome */
      font-family: "Font Awesome 5 Free";
      font-weight: 900;
      font-size: 11px;
    }
    /* تأثير عند الضغط أو الوقوف عليه */
    .remove-btn:hover, .remove-btn:active, .btn-danger:hover, .remove-fav-btn:hover {
      background: var(--danger);
      color: #fff;
      transform: translateY(-2px);
    }

    /* زر المفضلة الدائري (إن وجد) */
    .fav-btn {
      position: absolute;
      top: 6px; 
      left: 6px;
      background: rgba(18, 18, 18, 0.6);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.1);
      width: 26px; 
      height: 26px;
      border-radius: 50%;
      color: var(--text-main);
      font-size: 12px; 
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.3s;
      z-index: 10;
    }
    .fav-btn.favorited {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .fav-btn:active { transform: scale(1.1); }

    /* --------------------------------------------------- */
    /* Empty State */
    /* --------------------------------------------------- */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }
    .empty-state i {
      font-size: 60px;
      color: rgba(255, 255, 255, 0.05);
      margin-bottom: 15px;
    }
    .empty-state p {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-weight: 600;
    }
    .btn-browse {
      background: rgba(255, 208, 0, 0.1);
      color: var(--brand);
      border: 1px solid var(--brand);
      padding: 10px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition: 0.3s;
    }
    .btn-browse:hover {
      background: var(--brand);
      color: #111;
    }

    /* النافبار السفلي */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-around;
      padding: 10px 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      z-index: 1000;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      transition: 0.3s;
    }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: var(--brand); }
    .nav-item.active i { transform: scale(1.1); }
    
    .cart-badge {
      position: absolute;
      top: -3px;
      right: -5px;
      background: var(--danger);
      color: #fff;
      font-size: 9px;
      font-weight: bold;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--bg-card);
    }

    /* الفوتر */
    .footer {
      background: var(--bg-card);
      padding: 30px 20px 100px;
      border-top: 1px solid rgba(255,255,255,0.05);
      text-align: center;
      margin-top: 40px;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    .social-links a {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      text-decoration: none;
      transition: 0.3s;
    }
    .social-links a:hover { background: var(--brand); color: #000; }
    .footer-text { color: var(--text-muted); font-size: 11px; }

    /* شاشات الديسكتوب */
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
      .product-card { padding: 12px; }
      .product-card img { height: 160px; margin: -12px -12px 10px -12px; width: calc(100% + 24px); }
      .product-card h3 { font-size: 16px; }
      .product-card p, .card-desc { font-size: 12px; -webkit-line-clamp: 2; }
      .price { font-size: 18px; }
      .add-cart-btn, .remove-btn { padding: 10px; font-size: 14px; }
      .bottom-nav { display: none; }
      body { padding-bottom: 0; }
    }
    @media (min-width: 1024px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

  <!-- الهيدر العلوي -->
  <header class="top-header">
    <img id="logo-img" src="logo.png" alt="BB2 Burger">
    <a href="index.html" class="icon-btn"><i class="fas fa-home"></i></a>
  </header>

  <!-- محتوى المفضلة -->
  <section class="container">
    <div class="page-header">
      <h2 class="page-title"><i class="fas fa-heart"></i> منتجاتي المفضلة</h2>
    </div>
    
    <!-- شبكة المنتجات (يتم حقنها من الجافاسكريبت) -->
    <div id="favorites-grid" class="grid"></div>
    
    <!-- التصميم الأنيق لحالة عدم وجود مفضلة -->
    <div id="no-favorites" class="empty-state" style="display: none;">
      <i class="fas fa-heart-broken"></i>
      <p>لا توجد منتجات في المفضلة حالياً</p>
      <a href="menu.html" class="btn-browse">تصفح المنيو الآن</a>
    </div>
  </section>

  <!-- الفوتر -->
  <footer class="footer">
    <div class="container">
      <div class="social-links">
        <a href="https://www.facebook.com/share/1EhgB6LvHR/"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/bb2burger"><i class="fab fa-instagram"></i></a>
        <a href="https://wa.me/201006473229"><i class="fab fa-whatsapp"></i></a>
        <a href="https://system.smart-mate.co/profile/5526289899"><i class="fas fa-globe"></i></a>
      </div>
      <p class="footer-text" id="footer-address">المنصورة - حي الجامعة</p>
      <p class="footer-text" id="footer-hours">مفتوح يومياً من 1 ظهراً حتى 3 فجراً</p>
      <p class="footer-text">© 2025 BB2 Burger. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <!-- النافبار السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fas fa-home"></i>
      <span>الرئيسية</span>
    </a>
    <a href="menu.html" class="nav-item">
      <i class="fas fa-hamburger"></i>
      <span>المنيو</span>
    </a>
    <a href="favorites.html" class="nav-item active">
      <i class="fas fa-heart"></i>
      <span>المفضلة</span>
    </a>
    <a href="cart.html" class="nav-item" style="position: relative;">
      <i class="fas fa-shopping-cart"></i>
      <span>السلة</span>
      <div class="cart-badge" id="cart-count">0</div>
    </a>
  </nav>

  <!-- الإشعارات العائمة -->
  <div id="toast" style="display: none; position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: var(--brand); color: #000; padding: 12px 25px; border-radius: 25px; font-weight: bold; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3);"></div>

  <script type="text/javascript">
    var gk_isXlsx = false;
    var gk_xlsxFileLookup = {};
    var gk_fileData = {};
    function filledCell(cell) { return cell !== '' && cell != null; }
    function loadFileData(filename) {
      if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
        try {
          var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
          var firstSheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[firstSheetName];
          var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
          var filteredData = jsonData.filter(row => row.some(filledCell));
          var headerRowIndex = filteredData.findIndex((row, index) =>
            row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
          );
          if (headerRowIndex === -1 || headerRowIndex > 25) { headerRowIndex = 0; }
          var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); 
          csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
          return csv;
        } catch (e) {
          console.error(e);
          return "";
        }
      }
      return gk_fileData[filename] || "";
    }
  </script>

  <script src="app.js"></script>
</body>
</html>
